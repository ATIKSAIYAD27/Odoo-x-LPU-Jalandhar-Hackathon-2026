{% extends "base.html" %}
{% block content %}
<h2>Reset Password</h2>
<div class="card">
    <form method="POST">
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>
        <div class="form-group">
            <label>OTP Code</label>
            <input type="text" name="otp" required placeholder="6-digit code" maxlength="6">
        </div>
        <div class="form-group">
            <label>New Password</label>
            <input type="password" name="password" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary">Reset Password</button>
    </form>
    <p style="margin-top:15px"><a href="{{ url_for('auth.login') }}">Back to Login</a></p>
</div>
{% endblock %}
