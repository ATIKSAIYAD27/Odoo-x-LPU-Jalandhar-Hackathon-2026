{% extends "base.html" %}
{% block content %}
<h2>Add Receipt</h2>
<div class="card">
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label>Supplier</label>
                <input type="text" name="supplier" required>
            </div>
            <div class="form-group">
                <label>Destination Location</label>
                <select name="destination_location_id" required>
                    <option value="">Select Location</option>
                    {% for loc in locations %}
                    <option value="{{ loc.id }}">{{ loc.name }} ({{ loc.warehouse.name }})</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <h3 style="margin:15px 0 10px">Line Items</h3>
        <div id="line-items">
            <div class="form-row" style="margin-bottom:10px;">
                <div class="form-group">
                    <select name="product_id" required>
                        <option value="">Select Product</option>
                        {% for p in products %}
                        <option value="{{ p.id }}">{{ p.name }} ({{ p.sku }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <input type="number" name="quantity" placeholder="Quantity" required min="1">
                </div>
            </div>
        </div>
        <button type="button" class="btn btn-warning btn-sm" onclick="addLine()">+ Add Line</button>
        <br><br>
        <button type="submit" class="btn btn-primary">Create Receipt (Draft)</button>
        <a href="{{ url_for('operations.receipts') }}" class="btn btn-danger">Cancel</a>
    </form>
</div>
<script>
function addLine() {
    const div = document.createElement('div');
    div.className = 'form-row';
    div.style.marginBottom = '10px';
    div.innerHTML = `<div class="form-group"><select name="product_id" required><option value="">Select Product</option>{% for p in products %}<option value="{{ p.id }}">{{ p.name }} ({{ p.sku }})</option>{% endfor %}</select></div><div class="form-group"><input type="number" name="quantity" placeholder="Quantity" required min="1"></div>`;
    document.getElementById('line-items').appendChild(div);
}
</script>
{% endblock %}
