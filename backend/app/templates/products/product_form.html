{% extends "base.html" %}
{% block content %}
<h2>{{ product.name if product else 'Add New Product' }}</h2>
<div class="card">
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label>Product Name</label>
                <input type="text" name="name" value="{{ product.name if product }}" required>
            </div>
            <div class="form-group">
                <label>SKU</label>
                <input type="text" name="sku" value="{{ product.sku if product }}" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Category</label>
                <select name="category_id" required>
                    <option value="">Select Category</option>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}" {{ 'selected' if product and product.category_id == cat.id }}>{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>UOM</label>
                <input type="text" name="uom" value="{{ product.uom if product else 'pcs' }}" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Reorder Level</label>
                <input type="number" name="reorder_level" value="{{ product.reorder_level if product else 10 }}" required min="0">
            </div>
        </div>
        <button type="submit" class="btn btn-primary">{{ 'Update' if product else 'Add' }} Product</button>
        <a href="{{ url_for('products.product_list') }}" class="btn btn-danger">Cancel</a>
    </form>
</div>
{% endblock %}
